<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Interactive Water-Ripple Dot Grid Wave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --bg-color: #FFFFFF;
      --text-color: #1E0E2E;
    }

    [data-theme="dark"] {
      --bg-color: #0B0410;
      --text-color: #EDE5F4;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      touch-action: none;
    }

    .theme-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(121, 34, 165, 0.12);
      border: 1px solid rgba(121, 34, 165, 0.25);
      color: inherit;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: rgba(121, 34, 165, 0.22);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <canvas id="dotGridCanvas"></canvas>
  <button class="theme-toggle-btn" id="themeToggle" type="button">🌓 Toggle Theme</button>

  <script>
    const btn = document.getElementById('themeToggle');
    if (btn) {
      btn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      });
    }
  </script>
  <script src="assets/js/dot-grid-wave.js"></script>
</body>
</html>
