      <stop offset="0%" stop-color="#28113E"/>
      <stop offset="100%" stop-color="#12061C"/>
    </linearGradient>
    <linearGradient id="pf-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE9FE4"/>
      <stop offset="100%" stop-color="#9C52C2"/>
